name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Shell syntax
        run: |
          for f in scripts/*.sh hooks/*.sh; do bash -n "$f"; done

      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck --severity=warning scripts/*.sh hooks/*.sh

      - name: Unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
